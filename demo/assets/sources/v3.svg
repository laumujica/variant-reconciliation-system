<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="525" viewBox="0 0 1000 525"><rect width="100%" height="100%" fill="#fff"/><rect x="64" y="40" width="80" height="6" fill="#2357e8"/><text x="64" y="98" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#0e1b33">Creative Collaboration · Draft 3</text><g font-family="Arial,sans-serif"><text x="64" y="154" font-size="19" font-weight="700" fill="#1745c2">Featured Callouts</text><text x="64" y="190" font-size="21" fill="#26354e">A clear decision is a useful production input.</text><text x="64" y="257" font-size="19" font-weight="700" fill="#1745c2">Application / Team Use</text><text x="64" y="293" font-size="21" fill="#26354e">Use the approved summary as a content reference. Check every selected</text><text x="64" y="325" font-size="21" fill="#26354e">passage, document exceptions and keep layout decisions separate.</text><text x="64" y="392" font-size="19" font-weight="700" fill="#1745c2">About the Method</text><text x="64" y="428" font-size="21" fill="#26354e">Organize the alternatives before asking for a decision.</text></g><text x="64" y="497" font-family="Arial,sans-serif" font-size="14" fill="#64748b">VRS · Sample content</text></svg>