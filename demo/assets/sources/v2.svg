<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="589" viewBox="0 0 1000 589"><rect width="100%" height="100%" fill="#fff"/><rect x="64" y="40" width="80" height="6" fill="#2357e8"/><text x="64" y="98" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#0e1b33">Creative Collaboration · Draft 2</text><g font-family="Arial,sans-serif"><text x="64" y="154" font-size="19" font-weight="700" fill="#1745c2">Opening / Guide Description</text><text x="64" y="190" font-size="21" fill="#26354e">Make room for good work. Agree on the question, explore a few useful</text><text x="64" y="222" font-size="21" fill="#26354e">alternatives and document the choice before producing the final materials.</text><text x="64" y="289" font-size="19" font-weight="700" fill="#1745c2">Featured Callouts</text><text x="64" y="325" font-size="21" fill="#26354e">Ask the question that changes the next step.</text><text x="64" y="392" font-size="19" font-weight="700" fill="#1745c2">About the Method</text><text x="64" y="428" font-size="21" fill="#26354e">This method organizes existing alternatives into a small set of reviewable</text><text x="64" y="460" font-size="21" fill="#26354e">questions. The team keeps the useful differences and removes repetition</text><text x="64" y="492" font-size="21" fill="#26354e">before production.</text></g><text x="64" y="561" font-family="Arial,sans-serif" font-size="14" fill="#64748b">VRS · Sample content</text></svg>