<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="724" viewBox="0 0 1000 724"><rect width="100%" height="100%" fill="#fff"/><rect x="64" y="40" width="80" height="6" fill="#2357e8"/><text x="64" y="98" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#0e1b33">Creative Collaboration · Draft 1</text><g font-family="Arial,sans-serif"><text x="64" y="154" font-size="19" font-weight="700" fill="#1745c2">Opening / Guide Description</text><text x="64" y="190" font-size="21" fill="#26354e">Creative work benefits from a shared starting point. This guide helps a</text><text x="64" y="222" font-size="21" fill="#26354e">small team clarify its purpose, compare possible directions and agree on</text><text x="64" y="254" font-size="21" fill="#26354e">the next step.</text><text x="64" y="321" font-size="19" font-weight="700" fill="#1745c2">Featured Callouts</text><text x="64" y="357" font-size="21" fill="#26354e">A clear decision is a useful production input.</text><text x="64" y="424" font-size="19" font-weight="700" fill="#1745c2">Featured Callouts</text><text x="64" y="460" font-size="21" fill="#26354e">Keep the reasoning alongside the choice.</text><text x="64" y="527" font-size="19" font-weight="700" fill="#1745c2">Application / Team Use</text><text x="64" y="563" font-size="21" fill="#26354e">Before the meeting, gather the alternatives. During the review, decide by</text><text x="64" y="595" font-size="21" fill="#26354e">component. After the meeting, verify the selected wording and export the</text><text x="64" y="627" font-size="21" fill="#26354e">brief.</text></g><text x="64" y="696" font-family="Arial,sans-serif" font-size="14" fill="#64748b">VRS · Sample content</text></svg>